[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:core]
command=/opt/billionmail/core/billionmail
; Go serves only a private address; ferropost owns the public ports and
; proxies every route it does not implement yet to this address.
environment=FERROPOST_GO_INTERNAL_ADDR="127.0.0.1:8181",FERROPOST_RUST_JOBS="maillog,warmup,campaigns"
directory=/opt/billionmail/core/
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
startsecs=10
priority=100

[program:ferropost]
command=/opt/billionmail/core/ferropost
directory=/opt/billionmail/core/
environment=FERROPOST_GO_UPSTREAM="http://127.0.0.1:8181",FERROPOST_RUST_JOBS="maillog,warmup,campaigns",RUST_LOG="info"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
startsecs=10
priority=110

[program:fail2ban]
command=/usr/bin/fail2ban-server -xf start
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
startsecs=10
priority=200


[program:crond]
command=/usr/sbin/crond -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root

[eventlistener:processes]
command=/stop-supervisor.sh
events=PROCESS_STATE_STOPPED, PROCESS_STATE_EXITED, PROCESS_STATE_FATAL

[supervisorctl]
serverurl=unix:///var/run/supervisord.sock

[unix_http_server]
file=/var/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface