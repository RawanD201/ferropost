[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
ferropost-common = { path = "crates/common" }
ferropost-domain = { path = "crates/domain" }
ferropost-store = { path = "crates/store" }
ferropost-api = { path = "crates/api" }
ferropost-jobs = { path = "crates/jobs" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "form", "tokio", "matched-path"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1", "http2", "service"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "derive", "macros", "migrate"] }
fred = { version = "10", default-features = false, features = ["i-keys", "i-std"] }
moka = { version = "0.12", features = ["future"] }

jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
ipnet = "2"
regex = "1"
csv = "1"
bollard = { version = "0.19", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rust_xlsxwriter = "0.102"
zip = { version = "2", default-features = false, features = ["deflate"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
